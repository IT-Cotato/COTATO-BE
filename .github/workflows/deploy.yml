name: CI/CD

on:
  push:
    branches: [ "main" ]

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cotato-be

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # [0] 체크아웃
      - uses: actions/checkout@v3

      # [1] JDK 세팅
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      # [2] Gradle 빌드
      # 비밀값은 이미지에 포함하지 않고, 서버의 .env로 실행 시점에 주입한다.
      - name: Grant permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew bootJar -x test -x checkstyleMain -x checkstyleTest

      # [3] Docker 이미지 빌드 & 푸시
      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker 이미지 빌드 & 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: 배포 디렉토리 생성
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: mkdir -p /home/${{ secrets.SERVER_USER }}/cotato-be

      - name: Compose 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: docker-compose.yml
          target: /home/${{ secrets.SERVER_USER }}/cotato-be

      - name: 서버 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            DEPLOY_DIR=/home/${{ secrets.SERVER_USER }}/cotato-be
            COMPOSE_FILE=$DEPLOY_DIR/docker-compose.yml

            if ! docker compose version >/dev/null 2>&1; then
              echo "Docker Compose가 설치되어 있지 않습니다."
              exit 1
            fi

            # 컨테이너 실행 시 주입할 비밀값 (본인만 읽기 가능)
            umask 077
            cat > $DEPLOY_DIR/.env <<'EOF'
            SPRING_DATASOURCE_URL=${{ secrets.DB_PATH }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PWD=${{ secrets.DB_PWD }}
            DDL_AUTO=${{ secrets.DDL_AUTO }}
            DISCORD_BOT_TOKEN=${{ secrets.DISCORD_TOKEN }}
            GUILD_ID=${{ secrets.GUILD_ID }}
            CHANNEL_ID=${{ secrets.CHANNEL_ID }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }}
            S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
            S3_ACCESS_PASSWORD=${{ secrets.S3_ACCESS_PASSWORD }}
            EMAIL_ADDRESS=${{ secrets.MAIN_SES_EMAIL_ADDRESS }}
            AES_SECRET_KEY=${{ secrets.AES_SECRET_KEY }}
            AES_SECRET_SALT=${{ secrets.AES_SECRET_SALT }}
            SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}
            SENDER_PASSWORD=${{ secrets.SENDER_PASSWORD }}
            STANDARD_DISTANCE=${{ secrets.STANDARD_DISTANCE }}
            DEFAULT_PROFILE_IMAGE_FOLDER=${{ secrets.DEFAULT_PROFILE_IMAGE_FOLDER }}
            DEFAULT_PROFILE_IMAGE_FILE=${{ secrets.DEFAULT_PROFILE_IMAGE_FILE }}
            DEFAULT_PROFILE_IMAGE_URL=${{ secrets.DEFAULT_PROFILE_IMAGE_URL }}
            EOF

            # private 이미지 pull을 위한 로그인
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            DOCKER_IMAGE=${{ env.DOCKER_IMAGE }}:latest docker compose -f $COMPOSE_FILE pull
            DOCKER_IMAGE=${{ env.DOCKER_IMAGE }}:latest docker compose -f $COMPOSE_FILE up -d --remove-orphans
            docker logout
            docker image prune -f
